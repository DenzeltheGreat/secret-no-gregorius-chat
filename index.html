<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chat with no gregorius</title>
  <style>
    body { margin:0; font-family:Arial; background:#f0f0f0; }
    #header { background:#075E54; color:#fff; padding:10px; text-align:center; }
    #chat { height:70vh; overflow-y:auto; padding:10px; background:#e5ddd5; }
    .msg { margin:5px; padding:8px 12px; border-radius:10px; max-width:70%; }
    .me { background:#DCF8C6; margin-left:auto; }
    .other { background:#fff; margin-right:auto; }
    #inputBar { display:flex; padding:10px; background:#fff; }
    #msg { flex:1; padding:8px; border:1px solid #ccc; border-radius:20px; }
    #send { margin-left:10px; padding:8px 16px; background:#075E54; color:#fff; border:none; border-radius:20px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="header">free legit chat</div>
  <div id="chat"></div>
  <div id="inputBar">
    <input id="msg" placeholder="typy type messagey here">
    <button id="send">mengirim mwahhaha</button>
  </div>

<script>
let nick = prompt("Enter your name:");
document.getElementById("send").onclick = () => {
  let text = document.getElementById("msg").value;
  if(text){
    let div=document.createElement("div");
    div.className="msg me";
    div.innerHTML=`<b>${nick}:</b> ${text}`;
    document.getElementById("chat").appendChild(div);
    document.getElementById("msg").value="";
    document.getElementById("chat").scrollTop=document.getElementById("chat").scrollHeight;
  }
};
</script>
</body>
</html>
